name: rosenweg_mein_telefon
description: "Rosenweg Mein Telefon – Deine Rosenweg-Nummer einstellen: Weiterleitung, Voicemail, Geräte, Anmelde-QR für geteilte Telefone und Apps."
publish_to: 'none'

# version: x.y.z+Baunummer. Ein Merge auf main mit einer NEUEN Version (Tag
# vx.y.z gibt es noch nicht) baut alle Plattformen und veroeffentlicht sie
# (GitHub-Release, /apps). Unveraenderte Version = nur CI, kein Release.
version: 1.0.3+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Gemeinsame Basis der Rosenweg-Apps: Anmeldung (Karte, QR, Konto, still per
  # Kerberos), API, Gerüst (Handy/Desktop), Updater, Logo-Baukasten.
  # Oeffentliches Repo: pub holt es ohne Token; lokal mit ../rosenweg-basis
  # ueber pubspec_overrides.yaml (siehe README, "Entwickeln").
  rosenweg_basis:
    git:
      url: https://github.com/Rosenweg/rosenweg-basis.git
      # fester Tag (mit Updater und iOS-MainActor-Fix); neue Basis = neuer Tag
      ref: v0.8.0
  # Kommen schon mit rosenweg_basis (gleiche Fassungen); hier direkt, weil die
  # App sie selbst benutzt: Anmelde-QR zeichnen, Apps-Seite oeffnen.
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Logo fuer Anmeldeschirm, "Über" und Titelleiste (assets/logo/erzeugen.sh)
  assets:
    - assets/logo/rosenweg-mein-telefon-512.png
    - assets/logo/rosenweg-mein-telefon-klein.png
